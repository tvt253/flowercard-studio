services:
  # Render Static Site: 100% MIỄN PHÍ VĨNH VIỄN, KHÔNG BỊ SLEEP (Khuyên dùng tốt nhất)
  - type: web
    name: flowercard-studio
    runtime: static
    buildCommand: npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
